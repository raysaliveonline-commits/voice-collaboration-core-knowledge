site_name: Voice Collaboration Core Knowledge
site_description: A guided, scrollable engineering path through enterprise voice, SIP/RTP, Cisco collaboration, SBC interoperability and packet troubleshooting.
site_url: https://raysaliveonline-commits.github.io/voice-collaboration-core-knowledge/
repo_url: https://github.com/raysaliveonline-commits/voice-collaboration-core-knowledge
repo_name: raysaliveonline-commits/voice-collaboration-core-knowledge
edit_uri: edit/main/docs/
copyright: "Original content licensed CC BY 4.0 unless stated otherwise. Third-party content remains under its owners' terms."
theme:
  name: material
  language: en
  logo: assets/brand-mark.svg
  favicon: assets/brand-mark.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - assets/custom.css
plugins:
  - search
nav:
  - Start here: index.md
  - Deep-dive reference:
      - Protocol standards: standards/rfc-catalog.md
      - Cisco CUBE: vendors/cisco-cube-ios-xe-17-6.md
      - SBC learning map: vendors/sbc-training-map.md
      - Wireshark filters: wireshark/voice-display-filters.md
      - SIP packet analysis: troubleshooting/sip-call-analysis.md
      - RTP and one-way audio: troubleshooting/rtp-one-way-audio.md
      - TAC troubleshooting: troubleshooting/tac-method.md
      - Voice security: security/voice-security.md
      - VoIP-to-TDM / PRI: pstn/voip-to-tdm.md
      - Voice automation: automation/voice-automation.md
  - About:
      - Glossary: glossary.md
      - Source and licensing policy: source-policy.md
      - Copilot agent guidance: agent/copilot-agent-addendum.md
